<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BabySit — Ore Settimanali</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ── LOGIN SCREEN ── -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <div class="login-icon">🍼</div>
      <h1>BabySit</h1>
      <p class="login-sub">Gestione ore settimanali</p>
      <button id="google-signin-btn" class="btn-google">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Accedi con Google
      </button>
      <p class="login-hint">Solo gli account autorizzati potranno accedere</p>
    </div>
  </div>

  <!-- ── APP SCREEN ── -->
  <div id="app-screen" class="screen hidden">

    <header>
      <div class="header-brand">
        <span class="header-icon">🍼</span>
        <span class="header-title">BabySit</span>
      </div>
      <div class="header-user">
        <img id="user-avatar" src="" alt="" class="user-avatar hidden">
        <span id="user-name" class="user-name"></span>
        <button id="signout-btn" class="btn-signout" title="Esci">↩</button>
      </div>
    </header>

    <main>

      <!-- Week navigation -->
      <div class="week-nav">
        <button id="prev-week-btn" class="nav-arrow" title="Settimana precedente">‹</button>
        <div class="week-label-wrap">
          <span id="week-range" class="week-range"></span>
          <button id="today-btn" class="btn-today hidden">← Questa settimana</button>
        </div>
        <button id="next-week-btn" class="nav-arrow" title="Settimana successiva">›</button>
      </div>

      <!-- Budget summary -->
      <div class="budget-card">
        <div class="budget-stats">
          <div class="budget-stat">
            <span class="stat-label">Budget totale</span>
            <span class="stat-value neutral">13h</span>
          </div>
          <div class="budget-stat">
            <span class="stat-label">Sessioni standard</span>
            <span class="stat-value neutral" id="stat-standard">–</span>
          </div>
          <div class="budget-stat">
            <span class="stat-label">Ore extra</span>
            <span class="stat-value neutral" id="stat-extra">–</span>
          </div>
          <div class="budget-stat highlight">
            <span class="stat-label">Disponibili</span>
            <span class="stat-value" id="stat-remaining">13h</span>
          </div>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div class="progress-labels">
          <span id="progress-used-label">0h usate</span>
          <span id="progress-pct-label">0%</span>
        </div>
      </div>

      <!-- Day cards -->
      <div class="days-grid" id="days-grid">
        <!-- Rendered by JS -->
      </div>

    </main>

    <!-- Toast container -->
    <div id="toast-container"></div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
